spring.application.name=xpjact4_t4

# Puerto propio de la Actividad 4 (distinto al de las actividades 1, 2 y 3).
# Se puede cambiar sin recompilar con la variable PORT o con --server.port=XXXX
server.port=${PORT:8084}

# ---- MySQL ----
# Las credenciales reales se leen de variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# Los valores despues de ":" solo sirven para pruebas en la computadora local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xpjact4_t4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
# Clave secreta para firmar los tokens (minimo 32 caracteres). En el VPS va en la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:solo-para-pruebas-locales-xpjact4-t4-no-usar-en-vps}
# Tiempo de vida del token en minutos
jwt.minutos=${JWT_MINUTOS:60}

# Errores siempre como JSON
server.error.whitelabel.enabled=false
